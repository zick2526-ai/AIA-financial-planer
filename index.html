<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIA Financial Planner</title>
</head>
<body>
  <div id="loading" style="font-family:system-ui;padding:24px">กำลังโหลด AIA Financial Planner...</div>
  <script>
  (async()=>{
    const frozen='https://raw.githubusercontent.com/zick2526-ai/AIA-financial-planer/aaff1a2ef80c6d9c7bb6b3a5893759e7a4e22e26/index.html';
    const fallback='https://cdn.jsdelivr.net/gh/zick2526-ai/AIA-financial-planer@aaff1a2ef80c6d9c7bb6b3a5893759e7a4e22e26/index.html';
    async function loadBase(url,ms){
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),ms);
      try{
        const res=await fetch(url,{cache:'no-store',signal:ctrl.signal});
        if(!res.ok) throw new Error('HTTP '+res.status);
        return await res.text();
      }finally{clearTimeout(timer)}
    }
    try {
      let h;
      try{ h=await loadBase(frozen,8000); }
      catch(firstErr){ console.warn('[AIA Loader] raw fallback',firstErr); h=await loadBase(fallback,8000); }

      const nestedHomePatch=`let h=await (await fetch(u,{cache:'no-store'})).text();
      h=h.replace(/<button class="active" data-tab="dashboard">แดชบอร์ด<\\/button>/,'<button data-tab="dashboard">แดชบอร์ด</button>');
      h=h.replace(/<button(?: class="active")? data-tab="clients">ลูกค้าของฉัน<\\/button>/,'<button class="active" data-tab="clients">ลูกค้าของฉัน</button>');
      h=h.replace(/<section id="clients" class="section(?: active)?">/,'<section id="clients" class="section active">');
      h=h.replace(/<section id="dashboard" class="section(?: active)?">/,'<section id="dashboard" class="section">');
      h=h.replace(/<h2 id="pageTitle">[^<]*<\\/h2>/,'<h2 id="pageTitle">ลูกค้าของฉัน</h2>');
      h=h.replace(/<p id="clientLine">[^<]*<\\/p>/,'<p id="clientLine">ค้นหา เลือก หรือสร้างลูกค้าใหม่เพื่อเริ่มวางแผน</p>');
      h=h.replace(/<div class="actions" style="margin-top:18px"><button class="btn red" onclick="calcAll\\(\\)">คำนวณและสรุป<\\/button><button class="btn light" onclick="resetDemo\\(\\)">ล้างข้อมูล<\\/button><\\/div>/,'');`;
      h=h.replace(/let h=await \(await fetch\(u,\{cache:'no-store'\}\)\)\.text\(\);/,nestedHomePatch);

      h=h.replace('location.reload();',"if(typeof window.loadClients==='function') await window.loadClients(); if(typeof window.openClient==='function'){ await window.openClient(id); return; }");
      const target="h=h.replace('</body>',addons+'</body>');";
      const replacement="h=h.replace('</body>',addons+'<script src=\"./policy-scanner.js?v=20260822a\"><\\/script><script src=\"./admin-launcher.js?v=20260823a\"><\\/script><script src=\"./db-bridge.js?v=20260823a\"><\\/script><script src=\"./client-context-bridge.js?v=20260823a\"><\\/script><script src=\"./client-store-v42.js?v=20260825d\"><\\/script><script src=\"./dashboard-store-v45.js?v=20260825g\"><\\/script><script src=\"./health-planner.js?v=20260823c\"><\\/script><script src=\"./health-planner-v2.js?v=20260823c\"><\\/script><script src=\"./report-generator.js?v=20260823a\"><\\/script><script src=\"./report-store-v44.js?v=20260825f\"><\\/script><script src=\"./health-report-sync.js?v=20260823a\"><\\/script><script src=\"./calendar-assistant.js?v=20260824a\"><\\/script><script src=\"./calendar-store-v43.js?v=20260825e\"><\\/script><script src=\"./ux-policy-v29.js?v=20260824a\"><\\/script><script src=\"./policy-benefit-builder-v30.js?v=20260824b\"><\\/script><script src=\"./app-shell-v41.js?v=20260825c\"><\\/script></body>');";
      if(!h.includes(target)) throw new Error('ไม่พบจุดเชื่อมส่วนเสริม');
      h=h.replace(target,replacement);
      document.open();
      document.write(h);
      document.close();
    }catch(e){
      console.error('[AIA Loader]',e);
      document.getElementById('loading').innerHTML='<b>โหลดระบบไม่สำเร็จ</b><br><span style="font-size:13px;color:#666">กรุณากดรีเฟรชอีกครั้ง หากยังไม่ขึ้นให้ปิดแท็บแล้วเปิดใหม่</span>';
    }
  })();
  </script>
</body>
</html>
