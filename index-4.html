<!doctype html>

<body>
  <div id="loading" style="font-family:system-ui;padding:24px">กำลังโหลด AIA Financial Planner...</div>
  <script>
  (async()=>{
    try {
      const u='https://raw.githubusercontent.com/zick2526-ai/AIA-financial-planer/43ef6d6a92e44e6ea851a77f37718050d2e5ae38/index.html';
      let h=await (await fetch(u,{cache:'no-store'})).text();
      const v28="(() => {\n  'use strict';\n\n  const VERSION = '28.4.0';\n  const ROOT_ID = 'policy-portfolio-v28';\n  const STYLE_ID = 'policy-portfolio-v28-style';\n  const STORAGE_BUCKET = 'policy-documents';\n  const AIA_RED = '#d31145';\n\n  const state = {\n    policies: [],\n    client: null,\n    familyMembers: [],\n    filter: 'all',\n    editingId: null,\n    pendingFile: null,\n    objectUrl: null,\n  };\n\n  function getDb() {\n    const candidates = [];\n    try { if (typeof supabaseClient !== 'undefined') candidates.push(supabaseClient); } catch (_) {}\n    try { if (typeof sb !== 'undefined') candidates.push(sb); } catch (_) {}\n    try { if (typeof db !== 'undefined') candidates.push(db); } catch (_) {}\n    try { if (typeof supabase !== 'undefined') candidates.push(supabase); } catch (_) {}\n    candidates.push(window.supabaseClient, window.sb, window.db, window._supabase);\n    return candidates.find(x => x && typeof x.from === 'function') || null;\n  }\n\n  function getCurrentClientId() {\n    try { if (typeof currentClientId !== 'undefined' && currentClientId) return currentClientId; } catch (_) {}\n    return window.currentClientId || window.selectedClientId || null;\n  }\n\n  function money(n) {\n    const v = Number(n || 0);\n    return new Intl.NumberFormat('th-TH', { maximumFractionDigits: 0 }).format(v);\n  }\n\n  function esc(s) {\n    return String(s ?? '').replace(/[&<>\"']/g, m => ({\n      '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#039;'\n    }[m]));\n  }\n\n  function safeFileName(name) {\n    return String(name || 'document')\n      .normalize('NFKD')\n      .replace(/[^\\w.\\-ก-๙]+/g, '_')\n      .slice(-120);\n  }\n\n  function toast(msg, type='ok') {\n    let el = document.getElementById('pp28-toast');\n    if (!el) {\n      el = document.createElement('div');\n      el.id = 'pp28-toast';\n      document.body.appendChild(el);\n    }\n    el.textContent = msg;\n    el.className = 'pp28-toast show ' + type;\n    clearTimeout(el._t);\n    el._t = setTimeout(() => el.classList.remove('show'), 2600);\n  }\n\n  function installStyles() {\n    if (document.getElementById(STYLE_ID)) return;\n    const s = document.createElement('style');\n    s.id = STYLE_ID;\n    s.textContent = `\n      :root{--pp-red:${AIA_RED};--pp-ink:#202733;--pp-muted:#77808f;--pp-bg:#f5f6f8;--pp-card:#fff;--pp-line:#e7e9ee}\n      #${ROOT_ID}{position:fixed;inset:0;z-index:9998;background:var(--pp-bg);overflow:auto;font-family:inherit;color:var(--pp-ink)}\n      #${ROOT_ID} *{box-sizing:border-box}\n      .pp28-shell{max-width:1080px;margin:auto;min-height:100vh;padding-bottom:92px}\n      .pp28-top{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.97);border-bottom:1px solid #eceef2;padding:12px 16px}\n      .pp28-topline{display:flex;gap:12px;align-items:center;justify-content:space-between}\n      .pp28-brand{display:flex;align-items:center;gap:10px;min-width:0}\n      .pp28-back{border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:24px;cursor:pointer}\n      .pp28-logo{width:45px;height:45px;background:var(--pp-red);color:#fff;border-radius:13px;display:grid;place-items:center;font:700 25px Georgia,serif}\n      .pp28-brand h2{font-size:19px;margin:0;line-height:1.2}\n      .pp28-brand small{color:var(--pp-muted)}\n      .pp28-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}\n      .pp28-btn{border:1px solid #e0e3e9;background:#fff;color:var(--pp-ink);border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer;font-size:14px}\n      .pp28-btn.red{background:var(--pp-red);border-color:var(--pp-red);color:#fff}\n      .pp28-btn.soft{background:#fff4f7;color:var(--pp-red);border-color:#ffd7e1}\n      .pp28-main{padding:18px 16px}\n      .pp28-hero{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;align-items:end;margin-bottom:16px}\n      .pp28-eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:#7a8290}\n      .pp28-title{font-size:31px;margin:6px 0 5px;line-height:1.15}\n      .pp28-sub{color:#7a8290;line-height:1.55}\n      .pp28-select{width:100%;padding:12px 14px;border:1px solid #e1e4ea;border-radius:12px;background:#fff;font-weight:700}\n      .pp28-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}\n      .pp28-stat{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:18px;min-height:130px;box-shadow:0 4px 18px rgba(24,31,42,.035)}\n      .pp28-stat.redtop{border-top:4px solid var(--pp-red)}\n      .pp28-label{color:#7b8492;font-size:13px}\n      .pp28-value{font-weight:800;font-size:30px;margin-top:14px}\n      .pp28-unit{color:#7b8492;margin-top:8px;font-size:13px}\n      .pp28-card{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 4px 18px rgba(24,31,42,.035)}\n      .pp28-cardhead{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:12px}\n      .pp28-card h3{margin:0;font-size:18px}\n      .pp28-card p{margin:4px 0 0;color:#7c8593;font-size:13px}\n      .pp28-mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}\n      .pp28-mini{border-radius:13px;padding:13px;border:1px solid #eee}\n      .pp28-mini:nth-child(1){background:#fff5f7;border-color:#ffdce4}\n      .pp28-mini:nth-child(2){background:#fff9ef;border-color:#ffe7ba}\n      .pp28-mini:nth-child(3){background:#effaf5;border-color:#ccefe0}\n      .pp28-mini:nth-child(4){background:#f4f6ff;border-color:#dce2ff}\n      .pp28-mini b{display:block;font-size:18px;margin-top:4px}\n      .pp28-chart{width:100%;height:230px;overflow:hidden;margin-top:12px}\n      .pp28-chart svg{width:100%;height:100%}\n      .pp28-tablewrap{overflow:auto}\n      .pp28-table{width:100%;border-collapse:collapse;min-width:850px}\n      .pp28-table th,.pp28-table td{padding:11px 9px;border-bottom:1px solid #eef0f4;text-align:left;font-size:13px;vertical-align:top}\n      .pp28-table th{color:#717b89;font-size:12px}\n      .pp28-pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:#f4f5f7;font-size:11px;font-weight:700}\n      .pp28-pill.active{background:#eaf8f0;color:#16814a}\n      .pp28-linkbtn{border:0;background:transparent;color:var(--pp-red);font-weight:800;cursor:pointer;padding:4px}\n      .pp28-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n      .pp28-donutrow{display:flex;align-items:center;gap:28px;flex-wrap:wrap}\n      .pp28-donut{width:165px;height:165px;border-radius:50%;display:grid;place-items:center;position:relative}\n      .pp28-donut:after{content:\"\";width:98px;height:98px;background:#fff;border-radius:50%;position:absolute}\n      .pp28-donutcenter{position:absolute;z-index:1;text-align:center;font-weight:800}\n      .pp28-legend{flex:1;min-width:210px}\n      .pp28-legendrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f1f4;font-size:13px}\n      .pp28-empty{text-align:center;padding:28px;color:#8a929e}\n      .pp28-modalback{position:fixed;inset:0;z-index:10020;background:rgba(18,23,31,.48);display:grid;place-items:end center;padding:0}\n      .pp28-modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}\n      .pp28-modal h3{margin:0 0 4px}\n      .pp28-formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}\n      .pp28-field{display:flex;flex-direction:column;gap:5px}\n      .pp28-field.full{grid-column:1/-1}\n      .pp28-field label{font-size:12px;font-weight:800;color:#697281}\n      .pp28-field input,.pp28-field select{width:100%;border:1px solid #dfe3ea;border-radius:11px;padding:11px;font-size:16px;background:#fff}\n      .pp28-modalactions{display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:-18px;background:#fff;padding:14px 0 4px;margin-top:12px}\n      .pp28-preview{border:1px dashed #d9dde5;border-radius:14px;padding:12px;background:#fafbfc}\n      .pp28-preview img{max-width:100%;max-height:280px;border-radius:10px;display:block;margin:auto}\n      .pp28-filetag{display:flex;justify-content:space-between;gap:12px;align-items:center}\n      .pp28-floating{position:fixed;right:18px;bottom:18px;z-index:9999;display:flex;gap:8px}\n      .pp28-toast{position:fixed;z-index:10080;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#202733;color:#fff;border-radius:12px;padding:11px 16px;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}\n      .pp28-toast.show{opacity:1;transform:translate(-50%,0)}\n      .pp28-toast.err{background:#a81633}\n      @media(max-width:800px){\n        .pp28-topline{align-items:flex-start}.pp28-actions{max-width:52%}\n        .pp28-btn{padding:9px 10px;font-size:12px}\n        .pp28-hero{grid-template-columns:1fr}.pp28-title{font-size:28px}\n        .pp28-grid4{grid-template-columns:1fr 1fr}\n        .pp28-mini4{grid-template-columns:1fr 1fr}\n        .pp28-two{grid-template-columns:1fr}\n      }\n      @media(max-width:480px){\n        .pp28-brand small{display:none}.pp28-brand h2{font-size:16px}\n        .pp28-logo{width:40px;height:40px}.pp28-back{width:34px;height:34px}\n        .pp28-actions{max-width:55%;gap:5px}.pp28-actions .pp28-btn{font-size:11px;padding:8px}\n        .pp28-main{padding:15px 12px}.pp28-grid4{gap:8px}.pp28-stat{padding:15px;min-height:118px}\n        .pp28-value{font-size:25px}.pp28-formgrid{grid-template-columns:1fr}\n      }\n      @media print{\n        body>*:not(#${ROOT_ID}){display:none!important}\n        #${ROOT_ID}{position:static!important;overflow:visible!important;background:#fff}\n        .pp28-top,.pp28-floating,.pp28-btn,.pp28-linkbtn{display:none!important}\n        .pp28-shell{max-width:none;padding:0}.pp28-main{padding:0}\n        .pp28-card,.pp28-stat{break-inside:avoid;box-shadow:none}\n      }\n    `;\n    document.head.appendChild(s);\n  }\n\n  async function loadClientAndPolicies() {\n    const dbx = getDb();\n    const clientId = getCurrentClientId();\n    if (!dbx) throw new Error('ไม่พบการเชื่อมต่อฐานข้อมูล');\n    if (!clientId) throw new Error('กรุณาเลือกลูกค้าก่อนเปิดเมนูกรมธรรม์');\n\n    const [cRes, pRes, fRes] = await Promise.all([\n      dbx.from('clients').select('*').eq('id', clientId).maybeSingle(),\n      dbx.from('insurance_policies').select('*').eq('client_id', clientId).order('created_at', { ascending: false }),\n      dbx.from('family_members').select('*').eq('client_id', clientId).order('created_at', { ascending: true })\n    ]);\n    if (cRes.error) throw cRes.error;\n    if (pRes.error) throw pRes.error;\n    if (fRes.error) throw fRes.error;\n    state.client = cRes.data || { id: clientId };\n    state.policies = pRes.data || [];\n    state.familyMembers = fRes.data || [];\n  }\n\n  function filteredPolicies() {\n    if (state.filter === 'all') return state.policies;\n    return state.policies.filter(p => (p.insured_name || state.client?.full_name || '') === state.filter);\n  }\n\n  function summary(list=filteredPolicies()) {\n    const active = list.filter(p => (p.policy_status || 'active') !== 'cancelled');\n    const unique = new Set(active.map(p => p.insured_name).filter(Boolean));\n    return {\n      count: active.length,\n      sumAssured: active.reduce((a,p)=>a+Number(p.sum_assured||0),0),\n      premium: active.reduce((a,p)=>a+Number(p.annual_premium||0),0),\n      health: active.reduce((a,p)=>a+Number(p.health_limit||0),0),\n      ci: active.reduce((a,p)=>a+Number(p.ci_limit||0),0),\n      cashback: active.reduce((a,p)=>a+Number(p.annual_cashback||0),0),\n      maturity: active.reduce((a,p)=>a+Number(p.maturity_benefit||0),0),\n      members: unique.size || (active.length ? 1 : 0)\n    };\n  }\n\n  function typeBreakdown(list) {\n    const m = new Map();\n    list.forEach(p => {\n      const k = (p.policy_type || 'อื่น ๆ').trim() || 'อื่น ๆ';\n      m.set(k, (m.get(k)||0) + Number(p.sum_assured||0));\n    });\n    return [...m.entries()].sort((a,b)=>b[1]-a[1]);\n  }\n\n  function yearlySeries(list) {\n    const byAge = new Map();\n    list.forEach(p => {\n      const arr = Array.isArray(p.yearly_data) ? p.yearly_data : [];\n      arr.forEach(r => {\n        const age = Number(r.age ?? r.insured_age ?? r.end_age ?? r.policy_year ?? r.year);\n        if (!Number.isFinite(age)) return;\n        const row = byAge.get(age) || { age, death:0, cash:0, cashback:0 };\n        row.death += Number(r.death_benefit ?? r.sum_assured ?? r.life_benefit ?? 0);\n        row.cash += Number(r.surrender_value ?? r.cash_value ?? r.account_value ?? r.maturity_value ?? 0);\n        row.cashback += Number(r.cashback ?? r.annual_cashback ?? r.return ?? 0);\n        byAge.set(age,row);\n      });\n    });\n    return [...byAge.values()].sort((a,b)=>a.age-b.age);\n  }\n\n  function lineChart(list) {\n    const rows = yearlySeries(list);\n    if (!rows.length) return `<div class=\"pp28-empty\">ยังไม่มีข้อมูลผลประโยชน์รายปีในกรมธรรม์</div>`;\n    const W=820,H=210,pad=28;\n    const max = Math.max(1,...rows.flatMap(r=>[r.death,r.cash,r.cashback]));\n    const minAge=rows[0].age,maxAge=rows[rows.length-1].age;\n    const x=a=>pad+(W-pad*2)*((a-minAge)/Math.max(1,maxAge-minAge));\n    const y=v=>H-pad-(H-pad*2)*(v/max);\n    const points=(key)=>rows.map(r=>`${x(r.age).toFixed(1)},${y(r[key]).toFixed(1)}`).join(' ');\n    const ticks=[0,.25,.5,.75,1].map(t=>{\n      const yy=y(max*t); return `<line x1=\"${pad}\" y1=\"${yy}\" x2=\"${W-pad}\" y2=\"${yy}\" stroke=\"#eef0f4\"/><text x=\"2\" y=\"${yy+4}\" font-size=\"10\" fill=\"#8a929e\">${money(max*t)}</text>`;\n    }).join('');\n    const ageTicks=rows.filter((_,i)=>i===0||i===rows.length-1||i%Math.ceil(rows.length/5)===0)\n      .map(r=>`<text x=\"${x(r.age)}\" y=\"${H-4}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a929e\">${esc(r.age)}</text>`).join('');\n    return `<div class=\"pp28-chart\"><svg viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"none\">\n      ${ticks}\n      <polyline fill=\"none\" stroke=\"#d31145\" stroke-width=\"3\" points=\"${points('death')}\"/>\n      <polyline fill=\"none\" stroke=\"#f0ad3d\" stroke-width=\"3\" points=\"${points('cash')}\"/>\n      <polyline fill=\"none\" stroke=\"#2da879\" stroke-width=\"3\" points=\"${points('cashback')}\"/>\n      ${ageTicks}\n    </svg></div>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#757e8b\">\n      <span>● <b style=\"color:#d31145\">ทุนชีวิต</b></span>\n      <span>● <b style=\"color:#f0ad3d\">มูลค่าเงินสด/เงินคืน</b></span>\n      <span>● <b style=\"color:#2da879\">เงินคืนรายปี</b></span>\n    </div>`;\n  }\n\n  function donut(list) {\n    const entries = typeBreakdown(list);\n    const total = entries.reduce((a,x)=>a+x[1],0);\n    const colors=['#d31145','#f3ad3d','#2d9c72','#5865d8','#8a65c5','#49a6c8'];\n    if (!entries.length || total<=0) {\n      return `<div class=\"pp28-donutrow\"><div class=\"pp28-donut\" style=\"background:#eef0f4\"><div class=\"pp28-donutcenter\">฿0<br><small>รวมทั้งหมด</small></div></div><div class=\"pp28-legend\"><div class=\"pp28-empty\">ยังไม่มีข้อมูลทุนประกัน</div></div></div>`;\n    }\n    let deg=0;\n    const stops=entries.map((e,i)=>{\n      const start=deg; deg += (e[1]/total)*360;\n      return `${colors[i%colors.length]} ${start}deg ${deg}deg`;\n    }).join(',');\n    const legend=entries.map((e,i)=>`<div class=\"pp28-legendrow\"><span><b style=\"color:${colors[i%colors.length]}\">●</b> ${esc(e[0])}</span><b>${(e[1]/total*100).toFixed(0)}%</b></div>`).join('');\n    return `<div class=\"pp28-donutrow\"><div class=\"pp28-donut\" style=\"background:conic-gradient(${stops})\"><div class=\"pp28-donutcenter\">฿${money(total)}<br><small>รวมทั้งหมด</small></div></div><div class=\"pp28-legend\">${legend}</div></div>`;\n  }\n\n  function renderTable(list) {\n    if (!list.length) return `<div class=\"pp28-empty\">ยังไม่มีกรมธรรม์ — กด “เพิ่มกรมธรรม์”, “ถ่ายรูป” หรือ “อัปโหลดไฟล์” เพื่อเริ่มต้น</div>`;\n    return `<div class=\"pp28-tablewrap\"><table class=\"pp28-table\">\n      <thead><tr><th>ผู้เอาประกัน / เลขกรมธรรม์</th><th>บริษัท / แบบประกัน</th><th>ประเภท</th><th>ทุนชีวิต</th><th>เบี้ย/ปี</th><th>สุขภาพ</th><th>CI</th><th>สถานะ</th><th></th></tr></thead>\n      <tbody>${list.map(p=>`<tr>\n        <td><b>${esc(p.insured_name || state.client?.full_name || '-')}</b><br><span style=\"color:#8a929e\">${esc(p.policy_number||'-')}</span></td>\n        <td><b>${esc(p.insurer||'-')}</b><br><span style=\"color:#8a929e\">${esc(p.product_name||'-')}</span></td>\n        <td>${esc(p.policy_type||'-')}</td>\n        <td>฿${money(p.sum_assured)}</td><td>฿${money(p.annual_premium)}</td><td>฿${money(p.health_limit)}</td><td>฿${money(p.ci_limit)}</td>\n        <td><span class=\"pp28-pill ${(p.policy_status||'active')==='active'?'active':''}\">${esc(p.policy_status||'active')}</span></td>\n        <td style=\"white-space:nowrap\">\n          ${p.source_file_path?`<button class=\"pp28-linkbtn\" data-v28-action=\"doc\" data-id=\"${p.id}\">เอกสาร</button>`:''}\n          <button class=\"pp28-linkbtn\" data-v28-action=\"edit\" data-id=\"${p.id}\">แก้ไข</button>\n          <button class=\"pp28-linkbtn\" data-v28-action=\"delete\" data-id=\"${p.id}\">ลบ</button>\n        </td>\n      </tr>`).join('')}</tbody>\n    </table></div>`;\n  }\n\n  function followUps(list) {\n    const items = list.filter(p =>\n      (p.policy_status && p.policy_status !== 'active') ||\n      !p.policy_number || !p.product_name || !p.insured_name\n    );\n    if (!items.length) return `<div class=\"pp28-empty\">ยังไม่มีรายการที่ต้องติดตาม</div>`;\n    return renderTable(items.slice(0,5));\n  }\n\n  function allMemberNames() {\n    const names = [\n      state.client?.full_name,\n      ...state.familyMembers.map(m=>m.full_name),\n      ...state.policies.map(p=>p.insured_name)\n    ].filter(Boolean);\n    return [...new Set(names)];\n  }\n\n  function memberOptions() {\n    const members=allMemberNames();\n    return `<option value=\"all\">ทั้งหมด</option>${members.map(x=>`<option value=\"${esc(x)}\" ${state.filter===x?'selected':''}>${esc(x)}</option>`).join('')}`;\n  }\n\n  function insuredOptions(policy={}) {\n    const currentId = policy.insured_member_id || '';\n    const currentName = policy.insured_name || '';\n    const selfName = state.client?.full_name || 'ลูกค้าหลัก';\n    let html = `<option value=\"\" data-name=\"${esc(selfName)}\" ${(!currentId && (!currentName || currentName===selfName))?'selected':''}>${esc(selfName)} — ลูกค้าหลัก</option>`;\n    html += state.familyMembers.map(m => {\n      const selected = currentId===m.id || (!currentId && currentName===m.full_name);\n      const rel = m.relationship ? ` — ${esc(m.relationship)}` : '';\n      return `<option value=\"${m.id}\" data-name=\"${esc(m.full_name)}\" ${selected?'selected':''}>${esc(m.full_name)}${rel}</option>`;\n    }).join('');\n    return html;\n  }\n\n  function render() {\n    const root = document.getElementById(ROOT_ID);\n    if (!root) return;\n    const list = filteredPolicies();\n    const s = summary(list);\n    const clientName = state.client?.full_name || 'ลูกค้าปัจจุบัน';\n    root.innerHTML = `\n      <div class=\"pp28-shell\">\n        <header class=\"pp28-top\">\n          <div class=\"pp28-topline\">\n            <div class=\"pp28-brand\">\n              <button class=\"pp28-back\" data-v28-action=\"close\" aria-label=\"กลับ\">←</button>\n              <div class=\"pp28-logo\">P</div>\n              <div><h2>Policy View</h2><small>กรมธรรม์เดิมของ ${esc(clientName)}</small></div>\n            </div>\n            <div class=\"pp28-actions\">\n              <button class=\"pp28-btn soft\" data-v28-action=\"family\">👨‍👩‍👧 + สมาชิก</button>\n              <button class=\"pp28-btn\" data-v28-action=\"camera\">📷 ถ่ายรูป</button>\n              <button class=\"pp28-btn\" data-v28-action=\"upload\">📁 อัปโหลดไฟล์</button>\n              <button class=\"pp28-btn red\" data-v28-action=\"add\">＋ เพิ่มกรมธรรม์</button>\n            </div>\n          </div>\n        </header>\n\n        <main class=\"pp28-main\">\n          <div class=\"pp28-hero\">\n            <div>\n              <div class=\"pp28-eyebrow\">FAMILY PORTFOLIO</div>\n              <div class=\"pp28-title\">ภาพรวมความคุ้มครอง</div>\n              <div class=\"pp28-sub\">เห็นเบี้ย ความคุ้มครอง และกระแสเงินคืนของกรมธรรม์เดิมในจุดเดียว</div>\n            </div>\n            <div>\n              <label class=\"pp28-label\">สมาชิกในครอบครัว</label>\n              <select class=\"pp28-select\" id=\"pp28-member-filter\">${memberOptions()}</select>\n              <button class=\"pp28-btn\" style=\"width:100%;margin-top:8px\" data-v28-action=\"print\">⇩ ส่งออกรายงาน PDF</button>\n            </div>\n          </div>\n\n          <section class=\"pp28-grid4\">\n            <div class=\"pp28-stat\"><div class=\"pp28-label\">จำนวนกรมธรรม์</div><div class=\"pp28-value\">${s.count}</div><div class=\"pp28-unit\">ฉบับ</div></div>\n            <div class=\"pp28-stat redtop\"><div class=\"pp28-label\">ทุนประกันรวม</div><div class=\"pp28-value\">฿${money(s.sumAssured)}</div><div class=\"pp28-unit\">ความคุ้มครองชีวิต</div></div>\n            <div class=\"pp28-stat\"><div class=\"pp28-label\">เบี้ยรวมต่อปี</div><div class=\"pp28-value\">฿${money(s.premium)}</div><div class=\"pp28-unit\">เฉลี่ย ฿${money(s.premium/12)}/เดือน</div></div>\n            <div class=\"pp28-stat\"><div class=\"pp28-label\">สมาชิกที่ได้รับความคุ้มครอง</div><div class=\"pp28-value\">${s.members}</div><div class=\"pp28-unit\">คน</div></div>\n          </section>\n\n          <section class=\"pp28-card\">\n            <div class=\"pp28-cardhead\"><div><h3>ทุนชีวิต เงินคืน และเงินคืนตามอายุ</h3><p>สรุปผลประโยชน์จากกรมธรรม์ที่บันทึกไว้</p></div><span class=\"pp28-pill active\">รวมทุกฉบับ</span></div>\n            <div class=\"pp28-mini4\">\n              <div class=\"pp28-mini\"><span class=\"pp28-label\">ทุนชีวิตรวม</span><b>฿${money(s.sumAssured)}</b></div>\n              <div class=\"pp28-mini\"><span class=\"pp28-label\">เงินคืนรายปีรวม</span><b>฿${money(s.cashback)}</b></div>\n              <div class=\"pp28-mini\"><span class=\"pp28-label\">เงินครบกำหนดรวม</span><b>฿${money(s.maturity)}</b></div>\n              <div class=\"pp28-mini\"><span class=\"pp28-label\">สุขภาพ + CI</span><b>฿${money(s.health+s.ci)}</b></div>\n            </div>\n            ${lineChart(list)}\n          </section>\n\n          <section class=\"pp28-card\">\n            <div class=\"pp28-cardhead\"><div><h3>รายละเอียดกรมธรรม์</h3><p>ข้อมูลผู้เอาประกัน บริษัท แบบประกัน และความคุ้มครอง</p></div><span class=\"pp28-pill\">${list.length} ฉบับ</span></div>\n            ${renderTable(list)}\n          </section>\n\n          <section class=\"pp28-two\">\n            <div class=\"pp28-card\">\n              <div class=\"pp28-cardhead\"><div><h3>สัดส่วนตามประเภท</h3><p>คำนวณจากทุนประกันรวม</p></div></div>\n              ${donut(list)}\n            </div>\n            <div class=\"pp28-card\">\n              <div class=\"pp28-cardhead\"><div><h3>Protection Snapshot</h3><p>ยอดเดิมที่ส่งต่อให้ระบบวางแผนใช้วิเคราะห์ Gap</p></div></div>\n              <div class=\"pp28-mini4\" style=\"grid-template-columns:1fr 1fr\">\n                <div class=\"pp28-mini\"><span class=\"pp28-label\">ชีวิต</span><b>฿${money(s.sumAssured)}</b></div>\n                <div class=\"pp28-mini\"><span class=\"pp28-label\">สุขภาพ</span><b>฿${money(s.health)}</b></div>\n                <div class=\"pp28-mini\"><span class=\"pp28-label\">โรคร้ายแรง</span><b>฿${money(s.ci)}</b></div>\n                <div class=\"pp28-mini\"><span class=\"pp28-label\">เบี้ย/ปี</span><b>฿${money(s.premium)}</b></div>\n              </div>\n            </div>\n          </section>\n\n          <section class=\"pp28-card\">\n            <div class=\"pp28-cardhead\"><div><h3>กรมธรรม์ที่ต้องติดตาม</h3><p>สถานะผิดปกติหรือข้อมูลสำคัญยังไม่ครบ</p></div></div>\n            ${followUps(list)}\n          </section>\n        </main>\n      </div>\n\n      <input id=\"pp28-camera-input\" type=\"file\" accept=\"image/*\" capture=\"environment\" hidden>\n      <input id=\"pp28-file-input\" type=\"file\" accept=\"image/*,.pdf,.xlsx,.xls,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel\" hidden>\n    `;\n    bindRootEvents(root);\n    publishSummary();\n  }\n\n  function bindRootEvents(root) {\n    const filter = root.querySelector('#pp28-member-filter');\n    filter?.addEventListener('change', e => { state.filter=e.target.value; render(); });\n\n    root.querySelectorAll('[data-v28-action]').forEach(btn=>{\n      btn.addEventListener('click', async e=>{\n        const action=e.currentTarget.dataset.v28Action;\n        const id=e.currentTarget.dataset.id;\n        if (action==='close') return close();\n        if (action==='family') return openFamilyMemberModal();\n        if (action==='camera') return root.querySelector('#pp28-camera-input')?.click();\n        if (action==='upload') return root.querySelector('#pp28-file-input')?.click();\n        if (action==='add') return openPolicyForm();\n        if (action==='print') return window.print();\n        if (action==='edit') return openPolicyForm(state.policies.find(p=>p.id===id));\n        if (action==='delete') return deletePolicy(id);\n        if (action==='doc') return openDocument(id);\n      });\n    });\n\n    root.querySelector('#pp28-camera-input')?.addEventListener('change', onFileSelected);\n    root.querySelector('#pp28-file-input')?.addEventListener('change', onFileSelected);\n  }\n\n  function onFileSelected(e) {\n    const file=e.target.files?.[0];\n    e.target.value='';\n    if (!file) return;\n    if (file.size > 15*1024*1024) return toast('ไฟล์ต้องมีขนาดไม่เกิน 15 MB','err');\n    state.pendingFile=file;\n    if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);\n    state.objectUrl = file.type.startsWith('image/') ? URL.createObjectURL(file) : null;\n    openPolicyForm(null, file);\n  }\n\n  function formValue(form, name) {\n    const el=form.elements[name];\n    if (!el) return null;\n    if (el.type==='number') return el.value==='' ? 0 : Number(el.value);\n    return el.value.trim();\n  }\n\n  function openPolicyForm(policy=null, file=null) {\n    state.editingId=policy?.id || null;\n    const p=policy||{};\n    const back=document.createElement('div');\n    back.className='pp28-modalback';\n    back.id='pp28-modalback';\n    const previewFile=file||state.pendingFile;\n    back.innerHTML=`<div class=\"pp28-modal\">\n      <div class=\"pp28-cardhead\">\n        <div><h3>${policy?'แก้ไขกรมธรรม์':'เพิ่มกรมธรรม์'}</h3><p>${previewFile?'แนบเอกสารแล้ว กรุณาตรวจและกรอกข้อมูลสำคัญก่อนบันทึก':'กรอกข้อมูลกรมธรรม์เดิมของลูกค้า'}</p></div>\n        <button class=\"pp28-btn\" id=\"pp28-modal-close\">✕</button>\n      </div>\n      ${previewFile?`<div class=\"pp28-preview\">\n        ${state.objectUrl?`<img src=\"${state.objectUrl}\" alt=\"ตัวอย่างเอกสาร\">`:''}\n        <div class=\"pp28-filetag\"><span>📎 ${esc(previewFile.name)}</span><small>${(previewFile.size/1024/1024).toFixed(2)} MB</small></div>\n      </div>`:''}\n      <form id=\"pp28-policy-form\">\n        <div class=\"pp28-formgrid\" style=\"margin-top:12px\">\n          <div class=\"pp28-field\"><label>ผู้เอาประกัน / สมาชิกครอบครัว</label><select name=\"insured_member_id\" required>${insuredOptions(p)}</select></div>\n          <div class=\"pp28-field\"><label>เลขกรมธรรม์</label><input name=\"policy_number\" value=\"${esc(p.policy_number||'')}\"></div>\n          <div class=\"pp28-field\"><label>บริษัทประกัน</label><input name=\"insurer\" value=\"${esc(p.insurer||'AIA')}\"></div>\n          <div class=\"pp28-field\"><label>ชื่อแบบประกัน</label><input name=\"product_name\" value=\"${esc(p.product_name||'')}\"></div>\n          <div class=\"pp28-field\"><label>ประเภท</label><select name=\"policy_type\">\n            ${['ชีวิต','สะสมทรัพย์','บำนาญ','Unit Linked','สุขภาพ','โรคร้ายแรง','อุบัติเหตุ','อื่น ๆ'].map(x=>`<option ${p.policy_type===x?'selected':''}>${x}</option>`).join('')}\n          </select></div>\n          <div class=\"pp28-field\"><label>สถานะ</label><select name=\"policy_status\">\n            ${[['active','มีผลบังคับ'],['paid_up','ชำระเบี้ยครบ'],['lapsed','ขาดอายุ'],['cancelled','ยกเลิก']].map(([v,l])=>`<option value=\"${v}\" ${(p.policy_status||'active')===v?'selected':''}>${l}</option>`).join('')}\n          </select></div>\n          <div class=\"pp28-field\"><label>ทุนประกันชีวิต</label><input type=\"number\" min=\"0\" name=\"sum_assured\" value=\"${Number(p.sum_assured||0)}\"></div>\n          <div class=\"pp28-field\"><label>เบี้ยประกันต่อปี</label><input type=\"number\" min=\"0\" name=\"annual_premium\" value=\"${Number(p.annual_premium||0)}\"></div>\n          <div class=\"pp28-field\"><label>วงเงินสุขภาพ</label><input type=\"number\" min=\"0\" name=\"health_limit\" value=\"${Number(p.health_limit||0)}\"></div>\n          <div class=\"pp28-field\"><label>วงเงินโรคร้ายแรง (CI)</label><input type=\"number\" min=\"0\" name=\"ci_limit\" value=\"${Number(p.ci_limit||0)}\"></div>\n          <div class=\"pp28-field\"><label>อายุเริ่มสัญญา</label><input type=\"number\" min=\"0\" max=\"120\" name=\"start_age\" value=\"${p.start_age??''}\"></div>\n          <div class=\"pp28-field\"><label>ระยะเวลาคุ้มครอง (ปี)</label><input type=\"number\" min=\"0\" name=\"term_years\" value=\"${p.term_years??''}\"></div>\n          <div class=\"pp28-field\"><label>ระยะเวลาชำระเบี้ย (ปี)</label><input type=\"number\" min=\"0\" name=\"pay_years\" value=\"${p.pay_years??''}\"></div>\n          <div class=\"pp28-field\"><label>เงินคืนต่อปี</label><input type=\"number\" min=\"0\" name=\"annual_cashback\" value=\"${Number(p.annual_cashback||0)}\"></div>\n          <div class=\"pp28-field full\"><label>เงินครบกำหนด</label><input type=\"number\" min=\"0\" name=\"maturity_benefit\" value=\"${Number(p.maturity_benefit||0)}\"></div>\n        </div>\n        <div class=\"pp28-modalactions\">\n          <button type=\"button\" class=\"pp28-btn\" id=\"pp28-cancel\">ยกเลิก</button>\n          <button type=\"submit\" class=\"pp28-btn red\">บันทึกกรมธรรม์</button>\n        </div>\n      </form>\n    </div>`;\n    document.body.appendChild(back);\n    const cleanup=()=>{ back.remove(); };\n    back.querySelector('#pp28-modal-close').onclick=cleanup;\n    back.querySelector('#pp28-cancel').onclick=cleanup;\n    back.addEventListener('click',e=>{if(e.target===back)cleanup();});\n    back.querySelector('#pp28-policy-form').addEventListener('submit', async e=>{\n      e.preventDefault();\n      const submit=e.submitter; if(submit) submit.disabled=true;\n      try {\n        await savePolicy(e.currentTarget, policy, previewFile);\n        cleanup();\n      } catch(err) {\n        console.error('[Policy V28] save error',err);\n        toast(err.message||'บันทึกไม่สำเร็จ','err');\n      } finally { if(submit) submit.disabled=false; }\n    });\n  }\n\n\n  function openFamilyMemberModal() {\n    const back=document.createElement('div');\n    back.className='pp28-modalback';\n    back.id='pp28-family-modal';\n    const rows = state.familyMembers.length\n      ? state.familyMembers.map(m=>`<div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eef0f4\">\n          <div><b>${esc(m.full_name)}</b><div class=\"pp28-label\">${esc(m.relationship||'สมาชิกครอบครัว')}${m.birth_date?` · ${esc(m.birth_date)}`:''}</div></div>\n          <button type=\"button\" class=\"pp28-linkbtn\" data-family-delete=\"${m.id}\">ลบ</button>\n        </div>`).join('')\n      : `<div class=\"pp28-empty\" style=\"padding:14px\">ยังไม่มีสมาชิกครอบครัวเพิ่มเติม</div>`;\n\n    back.innerHTML=`<div class=\"pp28-modal\">\n      <div class=\"pp28-cardhead\">\n        <div><h3>สมาชิกในครอบครัว</h3><p>เพิ่มสมาชิกเพื่อผูกกรมธรรม์แต่ละฉบับให้ถูกคน</p></div>\n        <button class=\"pp28-btn\" id=\"pp28-family-close\">✕</button>\n      </div>\n      <div class=\"pp28-card\" style=\"margin-top:0\">\n        <div style=\"padding-bottom:8px\"><b>${esc(state.client?.full_name||'ลูกค้าหลัก')}</b><div class=\"pp28-label\">ลูกค้าหลัก</div></div>\n        ${rows}\n      </div>\n      <form id=\"pp28-family-form\" style=\"margin-top:12px\">\n        <div class=\"pp28-formgrid\">\n          <div class=\"pp28-field\"><label>ชื่อ-นามสกุล</label><input name=\"full_name\" required placeholder=\"เช่น นางเอ ใจดี\"></div>\n          <div class=\"pp28-field\"><label>ความสัมพันธ์</label><select name=\"relationship\">\n            <option>คู่สมรส</option><option>ลูก</option><option>พ่อ</option><option>แม่</option><option>พี่น้อง</option><option>ญาติ</option><option>อื่น ๆ</option>\n          </select></div>\n          <div class=\"pp28-field\"><label>วันเกิด</label><input type=\"date\" name=\"birth_date\"></div>\n          <div class=\"pp28-field\"><label>โทรศัพท์ (ถ้ามี)</label><input name=\"phone\"></div>\n        </div>\n        <div class=\"pp28-modalactions\">\n          <button type=\"button\" class=\"pp28-btn\" id=\"pp28-family-cancel\">ยกเลิก</button>\n          <button type=\"submit\" class=\"pp28-btn red\">+ เพิ่มสมาชิก</button>\n        </div>\n      </form>\n    </div>`;\n    document.body.appendChild(back);\n\n    const close=()=>back.remove();\n    back.querySelector('#pp28-family-close').onclick=close;\n    back.querySelector('#pp28-family-cancel').onclick=close;\n    back.addEventListener('click',e=>{if(e.target===back)close();});\n\n    back.querySelectorAll('[data-family-delete]').forEach(btn=>{\n      btn.onclick=async()=>{\n        const id=btn.dataset.familyDelete;\n        const member=state.familyMembers.find(m=>m.id===id);\n        if(!member || !confirm(`ลบสมาชิก ${member.full_name} ใช่หรือไม่? กรมธรรม์เดิมจะยังอยู่แต่จะไม่ผูกกับสมาชิกนี้`)) return;\n        const dbx=getDb();\n        const {error}=await dbx.from('family_members').delete().eq('id',id).eq('client_id',getCurrentClientId());\n        if(error) return toast(error.message||'ลบสมาชิกไม่สำเร็จ','err');\n        await refresh();\n        close();\n        openFamilyMemberModal();\n        toast('ลบสมาชิกแล้ว');\n      };\n    });\n\n    back.querySelector('#pp28-family-form').onsubmit=async e=>{\n      e.preventDefault();\n      const submit=e.submitter; if(submit) submit.disabled=true;\n      try{\n        const form=e.currentTarget;\n        const payload={\n          client_id:getCurrentClientId(),\n          full_name:form.elements.full_name.value.trim(),\n          relationship:form.elements.relationship.value||null,\n          birth_date:form.elements.birth_date.value||null,\n          phone:form.elements.phone.value.trim()||null,\n          updated_at:new Date().toISOString()\n        };\n        if(!payload.full_name) throw new Error('กรุณากรอกชื่อสมาชิก');\n        const dbx=getDb();\n        const {error}=await dbx.from('family_members').insert(payload);\n        if(error) throw error;\n        await refresh();\n        close();\n        toast('เพิ่มสมาชิกครอบครัวเรียบร้อย');\n      }catch(err){\n        console.error('[Policy V28 Family]',err);\n        toast(err.message||'เพิ่มสมาชิกไม่สำเร็จ','err');\n      }finally{ if(submit) submit.disabled=false; }\n    };\n  }\n\n  async function uploadFile(file) {\n    if (!file) return { path:null, name:null };\n    const dbx=getDb();\n    const clientId=getCurrentClientId();\n    const { data:authData, error:authErr }=await dbx.auth.getUser();\n    if (authErr) throw authErr;\n    const uid=authData?.user?.id;\n    if (!uid) throw new Error('กรุณาเข้าสู่ระบบก่อนอัปโหลดเอกสาร');\n    const path=`${uid}/${clientId}/${Date.now()}-${safeFileName(file.name)}`;\n    const { error }=await dbx.storage.from(STORAGE_BUCKET).upload(path,file,{upsert:false,contentType:file.type||undefined});\n    if (error) throw error;\n    return { path, name:file.name };\n  }\n\n  async function savePolicy(form, o
