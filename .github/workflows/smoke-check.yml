name: Smoke Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax check
        run: |
          node --check client-store-v42.js
          node --check open-client-v47.js
          node --check calendar-store-v43.js
          node --check report-store-v44.js
          node --check insurance-review-v48.js
          node --check insurance-review-ai-v50.js
          node --check sales-comparison-ui-v52.js
          node --check sales-advisor-v56.js
          node --check comparison-attachments-v55.js
          node --check comparison-regression-v57.js
          node --check navigation-regression-v58.js
          node --check auth-context-regression-v59.js
          node --check auth-redirect-regression-v60.js
          node --check policy-navigation-fix-v63.js
          node --check policy-navigation-hardfix-v64.js
          node --check insurance-review-menu-v49.js
          node --check app-shell-v41.js
          node --check admin-menu-v46.js
          node --check admin-ai-usage-v54.js
          node --check policy-scanner.js
          node --check ux-policy-v29.js
          node --check policy-benefit-builder-v30.js
      - name: Verify flat builder includes required modules
        run: |
          grep -q 'client-store-v42.js' scripts/build-flat.mjs
          grep -q 'calendar-store-v43.js' scripts/build-flat.mjs
          grep -q 'report-store-v44.js' scripts/build-flat.mjs
          grep -q 'insurance-review-v48.js' scripts/build-flat.mjs
          grep -q 'insurance-review-ai-v50.js' scripts/build-flat.mjs
          grep -q 'sales-comparison-ui-v52.js' scripts/build-flat.mjs
          grep -q 'sales-advisor-v56.js' scripts/build-flat.mjs
          grep -q 'comparison-attachments-v55.js' scripts/build-flat.mjs
          grep -q 'comparison-regression-v57.js' scripts/build-flat.mjs
          grep -q 'navigation-regression-v58.js' scripts/build-flat.mjs
          grep -q 'auth-context-regression-v59.js' scripts/build-flat.mjs
          grep -q 'auth-redirect-regression-v60.js' scripts/build-flat.mjs
          grep -q 'policy-navigation-fix-v63.js' scripts/build-flat.mjs
          grep -q 'policy-navigation-hardfix-v64.js' scripts/build-flat.mjs
          grep -q 'app-shell-v41.js' scripts/build-flat.mjs
          grep -q 'admin-menu-v46.js' scripts/build-flat.mjs
          if grep -q 'advisor-review-v51.js' scripts/build-flat.mjs; then echo 'legacy V51 must not be in production build'; exit 1; fi
          if grep -q 'sales-advisor-v53.js' scripts/build-flat.mjs; then echo 'legacy V53 must not be in production build'; exit 1; fi
